name: Release desktop and Android apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run desktop:build -- --publish never 2>&1 | Tee-Object desktop-build.log
          if ($LASTEXITCODE -ne 0) {
            $message = ((Get-Content desktop-build.log -Tail 30) -join "%0A")
            Write-Output "::error::$message"
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Aemeath-Windows.exe
            release/Aemeath-Windows.exe.blockmap
            release/latest.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aemeath-android-signing-v1
      - name: Prepare persistent Android signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Aemeath,OU=Mobile,O=Aemeath,L=Internet,ST=Online,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: npm ci
      - run: npm run android:sync
      - working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Aemeath-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Aemeath-Android.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/Aemeath-Windows.exe apps/Aemeath-Windows.exe.blockmap apps/latest.yml apps/Aemeath-Android.apk --repo "$GITHUB_REPOSITORY" --title "Aemeath $GITHUB_REF_NAME" --generate-notes
